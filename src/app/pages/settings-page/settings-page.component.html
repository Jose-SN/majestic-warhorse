<div class="approval-grid-page settings-page">
  <div class="approval-grid-page__backdrop" aria-hidden="true">
    <div class="approval-grid-page__technical-grid"></div>
    <div class="approval-grid-page__glow approval-grid-page__glow--purple"></div>
    <div class="approval-grid-page__glow approval-grid-page__glow--orange"></div>
    <div class="approval-grid-page__scanline"></div>
  </div>

  <div class="approval-grid-page__content">
    <header class="approval-grid-page__header">
      <div class="approval-grid-page__header-text">
        <h2>Settings</h2>
        <div class="approval-grid-page__header-meta">
          <span class="material-symbols-outlined" aria-hidden="true">settings</span>
          <span>Account & branding</span>
          <span>|</span>
          <span class="is-muted">
            @if (activeTab === 'account') {
              Account profile
            } @else {
              App branding
            }
          </span>
        </div>
      </div>
    </header>

    <div class="approval-grid-page__header-actions">
      <ul
        class="settings-page__tabs"
        [class.settings-page__tabs--single]="!showCustomizeTab"
        role="tablist"
        aria-label="Settings sections"
      >
        <li
          role="tab"
          [attr.aria-selected]="activeTab === 'account'"
          [class.is-active]="activeTab === 'account'"
          (click)="setTab('account')"
        >
          Account
        </li>
        @if (showCustomizeTab) {
          <li
            role="tab"
            [attr.aria-selected]="activeTab === 'customize'"
            [class.is-active]="activeTab === 'customize'"
            (click)="setTab('customize')"
          >
            Customize
          </li>
        }
      </ul>
    </div>

    <div class="settings-page__panel" role="tabpanel">
      @if (activeTab === 'account') {
        <app-account-settings />
      } @else if (activeTab === 'customize' && showCustomizeTab) {
        <app-customize-app [embedded]="true" />
      }
    </div>
  </div>
</div>
