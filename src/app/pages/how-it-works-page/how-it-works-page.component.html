<div class="hiw-page">
  <header class="hiw-page__bar">
    <div class="hiw-page__bar-inner">
      <button type="button" class="hiw-page__back" (click)="goBack()">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
        Back
      </button>
      <div class="hiw-page__title">
        <span class="material-symbols-outlined" aria-hidden="true">route</span>
        <span>How {{ appName }} works</span>
      </div>
      <div class="hiw-page__actions">
        @if (canCustomize) {
          <button type="button" class="hiw-page__ghost" (click)="goCustomize()">
            Customize
          </button>
        }
        <button type="button" class="hiw-page__ghost" (click)="goWebsite()">
          Website
        </button>
        <button type="button" class="hiw-page__cta" (click)="goPrimary()">
          {{ isLoggedIn ? 'Back to app' : 'Sign in' }}
        </button>
      </div>
    </div>
  </header>

  <iframe
    #embedFrame
    class="hiw-page__frame"
    [src]="embedUrl"
    title="How it works — product workflow"
    (load)="onFrameLoad()"
  ></iframe>
</div>
